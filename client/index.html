<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Cold Chain Theory — Cinematic Automotive CGI</title>
    <meta name="description" content="Cold Chain Theory is a premium automotive CGI studio turning machines into cinema." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Five of the seven project cards are still Unsplash. Opening that
         connection here saves the DNS lookup, the TCP handshake and the TLS
         negotiation from happening later, mid-transition, on the scene that
         needs the images. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Archivo Black replaces Fraunces as the display face. It ships one
         weight and one style — that is the whole design of it, a single black
         display cut — so unlike Fraunces there is no axis list to request, and
         nothing on the page may ask it for another weight. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
