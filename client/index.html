<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Cold Chain Theory — Cinematic Automotive CGI</title>
    <meta name="description" content="Cold Chain Theory is a premium automotive CGI studio turning machines into cinema." />
    <!-- The mascot's helmet, cropped square out of the studio's own render.
         Full-bleed, no rounded plate: at 16px a corner radius eats pixels the
         mark needs, and the browser rounds it itself where it wants to.

         The maker's name across the brow is blurred out. It is a real SMK lid
         and another company's trademark has no business being this site's
         icon. At 32px the patch is invisible; at 512 it reads as a soft band
         on the shell, which is the cheaper of the two problems.

         What survives the size drop is the visor - a bright band across a dark
         shell - which is why this reads as a helmet at 32px where a drawn flat
         silhouette read as a bucket. The 48/32/16 in the .ico carry a little
         extra contrast and brightness for the same reason. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One project card is still Unsplash: Custom CGI, the only build in the
         range without a machine of its own to show. It was five of seven when
         this was written, then the six coming-soon builds were cut and the
         count was never followed down.

         The preconnect stays for that one card. It saves the DNS lookup, the
         TCP handshake and the TLS negotiation from landing mid-transition on
         the scene that needs the image - a thinner win than it was, but the
         card is on the projects scene either way. Drop this line the moment
         Custom CGI gets a frame of its own. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Where a booking is written. The insert itself is milliseconds; what
         costs is that it is the first request this origin ever makes, so a
         submission pays for a DNS lookup, a TCP handshake, a TLS negotiation
         and the CORS preflight before the row is written. Measured cold on the
         studio's machine that is 433ms against 16ms once the connection is
         warm. Opened here so it is warm by the time anyone reaches step 06.

         crossorigin because the request that follows it carries an apikey
         header, which makes it a CORS request; a preconnect opened without it
         warms a connection the fetch will not reuse.

         The host is duplicated from client/src/lib/formHandler.ts, which is
         where it is configured. It cannot be read from there -- this file is
         static HTML and the tag has to be in the markup to be any use. If the
         project ever moves, both change. -->
    <link rel="preconnect" href="https://uqhgatgzgsnooanlfurs.supabase.co" crossorigin />
    <!-- Archivo Black replaces Fraunces as the display face. It ships one
         weight and one style — that is the whole design of it, a single black
         display cut — so unlike Fraunces there is no axis list to request, and
         nothing on the page may ask it for another weight. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
